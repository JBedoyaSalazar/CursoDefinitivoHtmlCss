<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <meta name="description" content="Entendiendo el responsive Image">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Jefred Bedoya">
    <!--Favicon structure-->
    <!-- Clásico: compatibilidad antigua -->
    <link rel="icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">

    <!-- PNG moderno para navegadores actuales -->
    <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../Assets/favicon/favicon-16x16.png">

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="../Assets/favicon/apple-touch-icon.png">

    <!-- Web App (PWA) -->
    <link rel="manifest" href="../Assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="../css/responsiveImg.css">
    <title>Responsive Image</title>
</head>
<body>
    <main>
        <picture>
            <source media="(min-width:1300px)" srcset="../Assets/Image/coockingImage.jpg">
            <source media="(min-width:1000px)" srcset="../Assets/Image/coockingImage.jpg">
            <img src="../Assets/Image/coockingImage.jpg" alt="Coocking">
        </picture>
    </main>
</body>
</html>
