<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entendiendo la medida 'rem' en css">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Jefred Bedoya">
    <!--Favicon structure-->
    <!-- Clásico: compatibilidad antigua -->
    <link rel="icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">

    <!-- PNG moderno para navegadores actuales -->
    <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../Assets/favicon/favicon-16x16.png">

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="../Assets/favicon/apple-touch-icon.png">

    <!-- Web App (PWA) -->
    <link rel="manifest" href="../Assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="../css/rem.css">
    <title>Rem</title>
</head>
<body>
    <main>
        <p>Soy un texto ejemplo</p>
        <div>
            <p>Soy otro parrafo</p>
            <div>
                <p>Soy otro parrafo</p>
                <div>
                    <p>Soy otro parrafo</p>
                    <div>
                        <p>Soy otro parrafo</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
