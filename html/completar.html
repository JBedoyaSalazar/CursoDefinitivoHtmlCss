<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aprendiendo a poner formularios con la opcion de autoCompletado en los navegadores web">
    <!--Deja que el navegador lea la pagina para recomendarla-->
    <meta name="robots" content= "index, follow">
    <!--Compatibilidad-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Jefred Bedoya">
    <!--Favicon structure-->
    <!-- Clásico: compatibilidad antigua -->
    <link rel="icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">

    <!-- PNG moderno para navegadores actuales -->
    <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../Assets/favicon/favicon-16x16.png">

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="../Assets/favicon/apple-touch-icon.png">

    <!-- Web App (PWA) -->
    <link rel="manifest" href="../Assets/favicon/site.webmanifest">
    <title>Formulario</title>
</head>
<body>
    <form action="">
        <label for="nombre">
            <span>Nombre:</span>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" autocomplete="name" required>
        </label>
        <label for="correo">
            <span>Correo</span>
            <input type="email" id="correo" name="correo" placeholder="Correo" autocomplete="email" autocorrect="off" required>
        </label>
        <label for="pais">
            <span>Pais</span>
            <input type="text" id="pais" name="pais" placeholder="Pais" autocomplete="country" required>
        </label>
        <label for="codigoPostal">
            <span>Codigo Postal</span>
            <input type="number" id="codigoPostal" name="codigoPostal" placeholder="Codigo Postal" autocomplete="postal-code" required>
        </label>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
