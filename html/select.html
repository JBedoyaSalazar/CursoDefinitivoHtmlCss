<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aprendiendo a hacer formularios con selectores">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Jefred Bedoya">
    <!--Favicon structure-->
    <!-- Clásico: compatibilidad antigua -->
    <link rel="icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../Assets/favicon/favicon.ico" type="image/x-icon">

    <!-- PNG moderno para navegadores actuales -->
    <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../Assets/favicon/favicon-16x16.png">

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="../Assets/favicon/apple-touch-icon.png">

    <!-- Web App (PWA) -->
    <link rel="manifest" href="../Assets/favicon/site.webmanifest">
    <title>Menu Desplegable</title>
</head>
<body>
    <main>
        <!--<select name="Cursos" id="">
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="HTML5">HTML5</option>
            <option value="Ruby">Ruby</option>
            <option value="Go">Go</option>
        </select> -->
        
        <form action="">
            <input list="cursos" placeholder="Elige un curso" autocorrect="off" required>
            <datalist id="cursos">
                <option value="JavaScript">
                <option value="Python">
                <option value="Java">
                <option value="HTML5">
                <option value="Ruby">
                <option value="Go">
            </datalist>

            <input type="submit" value="Submit">
        </form>
        
    </main>
</body>
</html>
